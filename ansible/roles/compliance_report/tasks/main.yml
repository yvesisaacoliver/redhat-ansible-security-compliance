---
# ══════════════════════════════════════════════
# Role: Compliance Report Generator
# Multi-environment dashboard with CIS mapping
# ══════════════════════════════════════════════

- name: "REPORT [{{ env_name }}] | Criar diretório de relatórios"
  ansible.builtin.file:
    path: "{{ report_output_dir }}"
    state: directory
    mode: '0755'
  run_once: true

- name: "REPORT [{{ env_name }}] | Coletar info do sistema"
  ansible.builtin.setup:
    gather_subset:
      - hardware
      - network
      - distribution

- name: "REPORT [{{ env_name }}] | Dump SSH config"
  ansible.builtin.command: sshd -T
  register: _rpt_sshd
  changed_when: false

- name: "REPORT [{{ env_name }}] | Firewalld state"
  ansible.builtin.command: firewall-cmd --state
  register: _rpt_fw
  changed_when: false
  failed_when: false

- name: "REPORT [{{ env_name }}] | Default firewall zone"
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: _rpt_fw_zone
  changed_when: false
  failed_when: false

- name: "REPORT [{{ env_name }}] | SELinux status"
  ansible.builtin.command: getenforce
  register: _rpt_selinux
  changed_when: false

- name: "REPORT [{{ env_name }}] | Auditd status"
  ansible.builtin.command: systemctl is-active auditd
  register: _rpt_auditd
  changed_when: false
  failed_when: false

- name: "REPORT [{{ env_name }}] | Audit rules count"
  ansible.builtin.command: auditctl -l
  register: _rpt_audit_rules
  changed_when: false
  failed_when: false

- name: "REPORT [{{ env_name }}] | Password policy"
  ansible.builtin.shell: grep '^PASS_MAX_DAYS' /etc/login.defs | awk '{print $2}'
  register: _rpt_pass_max
  changed_when: false

- name: "REPORT [{{ env_name }}] | Insights registration"
  ansible.builtin.command: insights-client --status
  register: _rpt_insights
  changed_when: false
  failed_when: false

- name: "REPORT [{{ env_name }}] | Banner check (STIG)"
  ansible.builtin.stat:
    path: /etc/issue.net
  register: _rpt_banner

- name: "REPORT [{{ env_name }}] | Compilar compliance data"
  ansible.builtin.set_fact:
    host_compliance:
      hostname: "{{ inventory_hostname }}"
      ip: "{{ ansible_default_ipv4.address | default('N/A') }}"
      os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      kernel: "{{ ansible_kernel }}"
      environment: "{{ env_name }}"
      cis_level: "{{ cis_level }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      baseline: "{{ baseline_state | default({}) }}"

      checks:
        ssh_root_disabled:
          name: "SSH Root Login Disabled"
          status: "{{ 'PASS' if 'permitrootlogin no' in _rpt_sshd.stdout | lower else 'FAIL' }}"
          cis_ref: "CIS 5.2.10"
          category: "ssh"

        ssh_password_auth:
          name: "SSH Password Auth (policy: {{ ssh_password_auth }})"
          status: "{{ 'PASS' if ('passwordauthentication ' + ssh_password_auth) in _rpt_sshd.stdout | lower else 'FAIL' }}"
          cis_ref: "CIS 5.2.6"
          category: "ssh"

        ssh_empty_password:
          name: "SSH Empty Passwords Blocked"
          status: "{{ 'PASS' if 'permitemptypasswords no' in _rpt_sshd.stdout | lower else 'FAIL' }}"
          cis_ref: "CIS 5.2.9"
          category: "ssh"

        firewall_active:
          name: "Firewall Active"
          status: "{{ 'PASS' if _rpt_fw.stdout | default('') == 'running' else 'FAIL' }}"
          cis_ref: "CIS 3.4.1"
          category: "firewall"

        firewall_zone:
          name: "Firewall Zone (expected: {{ firewall_default_zone }})"
          status: "{{ 'PASS' if _rpt_fw_zone.stdout | default('') == firewall_default_zone else 'FAIL' }}"
          cis_ref: "CIS 3.4.2"
          category: "firewall"

        selinux_enforcing:
          name: "SELinux Enforcing"
          status: "{{ 'PASS' if _rpt_selinux.stdout == 'Enforcing' else 'FAIL' }}"
          cis_ref: "CIS 1.6.1"
          category: "selinux"

        auditd_running:
          name: "Auditd Active"
          status: "{{ 'PASS' if _rpt_auditd.stdout | default('') == 'active' else 'FAIL' }}"
          cis_ref: "CIS 4.1.1"
          category: "audit"

        audit_rules:
          name: "Audit Rules Configured"
          status: "{{ 'PASS' if (_rpt_audit_rules.stdout_lines | default([]) | length) > 0 else 'FAIL' }}"
          cis_ref: "CIS 4.1.3"
          category: "audit"

        password_policy:
          name: "Password Max Days ≤ {{ password_max_days }}"
          status: "{{ 'PASS' if (_rpt_pass_max.stdout | default('99999') | int) <= (password_max_days | int) else 'FAIL' }}"
          cis_ref: "CIS 5.5.1"
          category: "users"

        insights_registered:
          name: "Red Hat Insights Registered"
          status: "{{ 'PASS' if 'registered' in (_rpt_insights.stdout | default('') | lower) else 'FAIL' }}"
          cis_ref: "N/A"
          category: "insights"

        stig_banner:
          name: "STIG Login Banner"
          status: "{{ 'PASS' if _rpt_banner.stat.exists else ('N/A' if not (stig_banner_enabled | default(false)) else 'FAIL') }}"
          cis_ref: "STIG V-230225"
          category: "stig"

- name: "REPORT [{{ env_name }}] | Gerar HTML report"
  ansible.builtin.template:
    src: compliance-report.html.j2
    dest: "{{ report_output_dir }}/compliance-report-{{ env_name }}.html"
    mode: '0644'
  run_once: true